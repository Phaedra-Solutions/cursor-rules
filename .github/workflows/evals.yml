name: Evals

# Manual only (decision D7): these runs make paid model calls. Never add pull_request or schedule triggers.
on:
  workflow_dispatch:
    inputs:
      rule:
        description: Rule ID to evaluate (for example frontend/nextjs); empty runs every suite
        type: string
        default: ''
      providers:
        description: Comma-separated promptfoo provider IDs
        type: string
        default: anthropic:messages:claude-opus-5

permissions:
  contents: read

concurrency:
  group: evals
  cancel-in-progress: false

jobs:
  evals:
    name: Run rule evals
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: evals
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Run promptfoo through the wrapper
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EVAL_RULE: ${{ inputs.rule }}
          EVAL_PROVIDERS: ${{ inputs.providers }}
        run: |
          if [ -n "$EVAL_RULE" ]; then
            node scripts/run-evals.mjs --rule "$EVAL_RULE" --out dist/evals
          else
            node scripts/run-evals.mjs --out dist/evals
          fi
      - name: Upload summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-summary
          path: |
            dist/evals/summary.md
            dist/evals/summary.json
            dist/evals/*.results.json
          retention-days: 14
          if-no-files-found: warn
