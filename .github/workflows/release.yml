name: Release

on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Lint, test and package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Lint
        run: node scripts/lint-rules.mjs
      - name: Test
        run: node --test scripts/lint-rules.test.mjs scripts/automation.test.mjs scripts/build.test.mjs scripts/run-evals.test.mjs
      - name: Check the README catalog
        run: node scripts/build.mjs --catalog --check
      - name: Check the CHANGELOG section
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "CHANGELOG.md has no '## [$version]' section" >&2
            exit 1
          fi
      - name: Check the CITATION.cff version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          if ! grep -Eq "^version: \"?${version}\"?$" CITATION.cff; then
            echo "CITATION.cff version doesn't match $version; update version and date-released" >&2
            exit 1
          fi
      - name: Build and package
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node scripts/build.mjs
          mkdir -p release
          for tool in cursor agents claude; do
            (cd "dist/$tool" && zip -qr "../../release/cursor-rules-${TAG}-${tool}.zip" .)
          done
          cp dist/manifest.json "release/cursor-rules-${TAG}-manifest.json"
          (cd release && sha256sum -- * > SHA256SUMS)
          cat release/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            release/
            release-notes.md
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Create the GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
      - name: Verify checksums
        run: cd release && sha256sum -c SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" release/* \
            --verify-tag \
            --title "$TAG" \
            --notes-file release-notes.md
