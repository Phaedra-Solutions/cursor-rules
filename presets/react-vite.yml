# Preset: react-vite. Build with: node scripts/build.mjs --preset react-vite
name: react-vite
description: React single-page app built with Vite.
rules:
  - core/*
  - languages/typescript
  - frontend/react
  - frontend/react-vite-spa
  - frontend/tailwind
  - frontend/forms-validation
  - frontend/state-and-data
  - testing/unit-js
  - testing/playwright
  - testing/a11y
  - devops/github-actions
skills:
  - security-audit
  - dependency-vet
  - cve-check
  - secrets-scan
  - threat-model-lite
  - incident-supply-chain
  - git-commit
  - migrate-cra-to-vite
conventions: [conventions/phaedra]
