# Bun supply-chain settings. Merge into the project's bunfig.toml.
# Source: Phaedra-Solutions/cursor-rules templates/package-managers.
# Bun only runs lifecycle scripts for packages listed in package.json
# "trustedDependencies"; keep that list short and reviewed.

[install]
# Only install versions published at least 7 days ago. Bun >= 1.3; value in seconds.
minimumReleaseAge = 604800
# Packages exempt from the age gate. Names: Bun >= 1.3; "name@version" entries
# (exempt one release, e.g. an urgent fix): Bun >= 1.4.4.
minimumReleaseAgeExcludes = ["@acme/internal"]
