# Yarn (Berry) supply-chain settings. Merge into the project's .yarnrc.yml.
# Source: Phaedra-Solutions/cursor-rules templates/package-managers.
# Yarn 1 (classic) has no age gate; move to Yarn 4 or use `yarn install --ignore-scripts`.

# Only install versions published at least a week ago. Yarn >= 4.10.0;
# Yarn >= 4.15.0 already defaults to 1 day.
npmMinimalAgeGate: "1w"

# Packages exempt from the age gate (descriptors or name globs). Yarn >= 4.10.0.
npmPreapprovedPackages:
  - "@acme/*"

# Don't run third-party postinstall scripts (the default). Allow specific
# packages in package.json "dependenciesMeta": { "<pkg>": { "built": true } }.
enableScripts: false
